name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Plugin check + MCP smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin manifest
        run: python3 ci/check_plugin.py

      - name: Set up server environment (venv --copies + deps)
        run: PYTHON_BIN=python3 bash setup.sh

      - name: MCP handshake smoke test
        run: python3 ci/mcp_handshake.py
